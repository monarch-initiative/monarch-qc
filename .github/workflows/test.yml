name: test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monarch-qc-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: monarch-qc-dashboard/yarn.lock

      - run: yarn install --frozen-lockfile

      - run: yarn vitest run

      - run: yarn build
